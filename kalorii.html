<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор нормы калорий и БЖУ — Просчёт</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Метрика -->
    <script type="text/javascript">(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");ym(113103717, "init", {clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:true});</script>
</head>
<body>

<div class="container">
    <header style="margin-bottom: 30px;"><a href="index.html" style="font-weight: bold;">← Назад к списку</a></header>
    <h1>Калькулятор нормы калорий (БЖУ)</h1>
    <p style="color: var(--color-text-muted); margin-bottom: 30px;">Рассчитайте суточную потребность в энергии для похудения, поддержки или набора массы.</p>

    <div class="card">
        <form id="calorieForm">
            <div class="form-group"><label for="gender">Пол</label><select id="gender"><option value="male">Мужской</option><option value="female">Женский</option></select></div>
            <div class="form-group"><label for="age">Возраст, лет</label><input type="number" id="age" value="30" required min="15" max="90"></div>
            <div class="form-group"><label for="weight">Вес, кг</label><input type="number" id="weight" value="75" required min="30" step="0.1"></div>
            <div class="form-group"><label for="height">Рост, см</label><input type="number" id="height" value="175" required min="120"></div>
            <div class="form-group"><label for="activity">Активность</label><select id="activity"><option value="1.2">Минимальная (сидячий образ жизни)</option><option value="1.375">Легкая (1-3 тренировки/нед)</option><option value="1.55" selected>Средняя (3-5 тренировок/нед)</option><option value="1.725">Высокая (6-7 тренировок/нед)</option><option value="1.9">Экстремальная (физработа/спорт 2 раза в день)</option></select></div>
            <div class="form-group"><label for="goal">Цель</label><select id="goal"><option value="-20%">Похудение (-20%)</option><option value="0%" selected>Поддержание веса</option><option value="+15%">Набор массы (+15%)</option></select></div>
            <button type="submit" class="btn-calc">Рассчитать норму</button>
        </form>
    </div>

    <div id="resultsArea" style="display:none;">
        <div class="result-box mt-1">
            <h3>Ваша суточная норма</h3>
            <div style="text-align:center; margin-top:15px;">
                <span style="color:var(--color-text-muted)">Калории (ккал):</span><br>
                <span class="big-number" id="totalCalories" style="font-size: 3rem;">0</span>
            </div>
            <div style="margin-top:20px; padding-top:15px; border-top:1px dashed var(--color-border); display:flex; justify-content:space-around; flex-wrap:wrap; gap:10px;">
                <div style="text-align:center;"><small style="color:var(--color-text-muted)">Белки</small><br><strong id="proteinGrams">0 г</strong></div>
                <div style="text-align:center;"><small style="color:var(--color-text-muted)">Жиры</small><br><strong id="fatGrams">0 г</strong></div>
                <div style="text-align:center;"><small style="color:var(--color-text-muted)">Углеводы</small><br><strong id="carbGrams">0 г</strong></div>
            </div>
        </div>

        <!-- ГРАФИК РАСПРЕДЕЛЕНИЯ БЖУ -->
        <div class="card mt-1 text-center">
            <h3>Соотношение нутриентов</h3>
            <div style="max-width: 350px; margin: 20px auto;"><canvas id="macrosPieChart"></canvas></div>
        </div>
    </div>

    <footer style="margin-top: 50px; text-align: center; color: var(--color-text-muted); font-size: 0.9rem;">© 2026 Просчёт · Не является медицинской рекомендацией.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const fmt = new Intl.NumberFormat('ru-RU');
    document.getElementById('calorieForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const gender = document.getElementById('gender').value;
        const age = parseFloat(document.getElementById('age').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        const activity = parseFloat(document.getElementById('activity').value);
        const goalMod = parseFloat(document.getElementById('goal').value.replace('%','')) / 100;

        // Формула Миффлина-Сан Жеора
        let bmr = (10 * weight) + (6.25 * height) - (5 * age);
        bmr += (gender === 'male') ? 5 : -161;
        
        let tdee = bmr * activity;
        let targetCalories = tdee * (1 + goalMod);

        // Расчет БЖУ (классика: 30% белок, 30% жиры, 40% углеводы для поддержания, корректируется под цель)
        let proteinPct = 0.3, fatPct = 0.3, carbPct = 0.4;
        if (goalMod < 0) { proteinPct = 0.4; fatPct = 0.3; carbPct = 0.3; } // Больше белка при похудении
        if (goalMod > 0) { proteinPct = 0.25; fatPct = 0.25; carbPct = 0.5; } // Больше углеводов при наборе

        const gramsProtein = Math.round((targetCalories * proteinPct) / 4);
        const gramsFat = Math.round((targetCalories * fatPct) / 9);
        const gramsCarbs = Math.round((targetCalories * carbPct) / 4);

        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('totalCalories').innerText = fmt.format(Math.round(targetCalories));
        document.getElementById('proteinGrams').innerText = gramsProtein + ' г';
        document.getElementById('fatGrams').innerText = gramsFat + ' г';
        document.getElementById('carbGrams').innerText = gramsCarbs + ' г';

        drawMacrosChart(gramsProtein, gramsFat, gramsCarbs);
        document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
    });

    function drawMacrosChart(p, f, c) {
        const ctx = document.getElementById('macrosPieChart').getContext('2d');
        if (window.myMacroChart) window.myMacroChart.destroy();
        window.myMacroChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Белки (' + p + 'г)', 'Жиры (' + f + 'г)', 'Углеводы (' + c + 'г)'],
                datasets: [{ data: [p, f, c], backgroundColor: ['#38bdf8', '#fbbf24', '#ef4444'], borderWidth: 0 }]
            },
            options: { responsive: true, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc' } } } }
        });
    }
</script>
</body>
</html>
