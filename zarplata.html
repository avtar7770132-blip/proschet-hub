<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор зарплаты: сколько на руки после НДФЛ — Просчёт</title>
    <meta name="description" content="Рассчитайте чистую зарплату (Net) из начисленной (Gross). Учет НДФЛ 13%, стандартных вычетов и прогрессивной шкалы 2025+.">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Яндекс Метрика -->
    <script type="text/javascript">(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");ym(113103717, "init", {clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:true});</script>
    <noscript><div><img src="https://mc.yandex.ru/watch/113103717" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
</head>
<body>

<div class="container">
    <header style="margin-bottom: 30px;">
        <a href="index.html" style="font-weight: bold;">← Назад к списку</a>
    </header>

    <h1>Калькулятор зарплаты «на руки»</h1>
    <p style="color: var(--color-text-muted); margin-bottom: 30px;">Переводим Gross в Net. Учитываем НДФЛ и возможные вычеты.</p>

    <div class="card">
        <form id="salaryForm">
            <div class="form-group">
                <label for="gross">Зарплата до вычета (Gross), ₽</label>
                <input type="number" id="gross" value="100000" required min="0" step="1000">
            </div>

            <div class="form-group">
                <label for="region">Регион налогообложения</label>
                <select id="region">
                    <option value="rf">Россия (Федеральный НДФЛ)</option>
                    <option value="other">Другой (упрощенно 13%)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="deduction">Стандартный налоговый вычет (если есть право)</label>
                <select id="deduction">
                    <option value="0">Нет вычета</option>
                    <option value="1400">1 400 ₽ (инвалид I-II гр., участник войны)</option>
                    <option value="3000">3 000 ₽ (ликвидатор ЧАЭС, инвалид ВОВ)</option>
                    <option value="500">500 ₽ (Герой РФ/СССР, космонавт)</option>
                    <option value="1200">1 200 ₽ (родитель 2+ детей / опекун)</option>
                    <option value="2400">2 400 ₽ (родитель 3+ детей / опекун)</option>
                </select>
            </div>

            <button type="submit" class="btn-calc">Рассчитать Net</button>
        </form>
    </div>

    <div id="resultsArea" style="display:none;">
        <div class="result-box mt-1">
            <h3>Итог за месяц</h3>
            <div style="display:flex; justify-content:space-around; flex-wrap:wrap; gap:20px; margin-top:15px;">
                <div style="text-align:center;">
                    <span style="color:var(--color-text-muted)">На руки (Net)</span><br>
                    <span class="big-number" id="netSalary">0 ₽</span>
                </div>
                <div style="text-align:center;">
                    <span style="color:var(--color-text-muted)">Налог (НДФЛ)</span><br>
                    <span class="big-number" id="taxAmount" style="color:#ef4444">0 ₽</span>
                </div>
            </div>
             <div style="margin-top:20px; padding-top:15px; border-top:1px dashed var(--color-border); text-align:center;">
                <small>Годовой доход на руки: <strong id="annualNet">0 ₽</strong></small>
            </div>
        </div>

        <!-- ГРАФИК РАСПРЕДЕЛЕНИЯ ДОХОДА -->
        <div class="card mt-1 text-center">
            <h3>Куда уходит ваш заработок?</h3>
            <div style="max-width: 350px; margin: 20px auto;">
                <canvas id="salaryPieChart"></canvas>
            </div>
        </div>
    </div>

    <footer style="margin-top: 50px; text-align: center; color: var(--color-text-muted); font-size: 0.9rem;">
        © 2026 Просчёт · Расчет носит ознакомительный характер.
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const fmt = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });

    document.getElementById('salaryForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const gross = parseFloat(document.getElementById('gross').value);
        const deductionType = parseInt(document.getElementById('deduction').value);
        
        if (!gross && gross !== 0) return alert("Введите сумму");

        // Логика расчета НДФЛ (упрощенная базовая 13%)
        // Для реального расчета нужна прогрессивная шкала, но для MVP используем базу
        
        let taxBase = gross - deductionType;
        if (taxBase < 0) taxBase = 0;
        
        let rate = 0.13; // Базовая ставка
        // TODO: Добавить логику прогрессивной шкалы для сумм > 5 млн руб/год
        
        let tax = taxBase * rate;
        let net = gross - tax;

        // Вывод результатов
        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('netSalary').innerText = fmt.format(Math.round(net)) + ' ₽';
        document.getElementById('taxAmount').innerText = '-' + fmt.format(Math.round(tax)) + ' ₽';
        document.getElementById('annualNet').innerText = fmt.format(Math.round(net * 12)) + ' ₽';

        drawSalaryChart(gross, tax, net);
        document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
    });

    function drawSalaryChart(gross, tax, net) {
        const ctx = document.getElementById('salaryPieChart').getContext('2d');
        if (window.mySalaryChart) window.mySalaryChart.destroy();

        window.mySalaryChart = new Chart(ctx, {
            type: 'pie', // Круговая диаграмма
            data: {
                labels: ['Вы получаете (Net)', 'Налог государству (НДФЛ)'],
                datasets: [{
                    data: [net, tax],
                    backgroundColor: ['#38bdf8', '#ef4444'],
                    borderWidth: 0,
                    hoverOffset: 10
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#f8fafc' } },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + fmt.format(context.parsed) + ' ₽';
                            }
                        }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
