<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор вклада и сложного процента — Просчёт</title>
    <meta name="description" content="Рассчитайте доходность депозита с учетом капитализации процентов. Узнайте итоговую сумму через N лет.">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Яндекс Метрика -->
    <script type="text/javascript">(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");ym(113103717, "init", {clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:true});</script>
    <noscript><div><img src="https://mc.yandex.ru/watch/113103717" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
</head>
<body>

<div class="container">
    <header style="margin-bottom: 30px;">
        <a href="index.html" style="font-weight: bold;">← Назад к списку</a>
    </header>

    <h1>Калькулятор вклада (Сложный %)</h1>
    <p style="color: var(--color-text-muted); margin-bottom: 30px;">Магия капитализации: как проценты приносят новые проценты.</p>

    <div class="card">
        <form id="depositForm">
            <div class="form-group">
                <label for="initialSum">Начальная сумма, ₽</label>
                <input type="number" id="initialSum" value="100000" required min="1000">
            </div>

            <div class="form-group">
                <label for="monthlyAdd">Ежемесячное пополнение, ₽</label>
                <input type="number" id="monthlyAdd" value="0" min="0">
            </div>

            <div class="form-group">
                <label for="rate">Ставка, % годовых</label>
                <input type="number" id="rate" value="16" required min="0.1" step="0.1">
            </div>

            <div class="form-group">
                <label for="years">Срок, лет</label>
                <input type="number" id="years" value="5" required min="1" max="50">
            </div>
            
             <div class="form-group">
                <label for="capitalization">Капитализация процентов</label>
                <select id="capitalization">
                    <option value="monthly">Ежемесячно (в конце месяца)</option>
                    <option value="none">Без капитализации (простые проценты)</option>
                </select>
            </div>

            <button type="submit" class="btn-calc">Рассчитать доходность</button>
        </form>
    </div>

    <div id="resultsArea" style="display:none;">
        <div class="result-box mt-1">
            <h3>Итог через <span id="periodLabel">5</span> лет</h3>
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px; margin-top:15px;">
                <div>
                    <span style="color:var(--color-text-muted)">Конечная сумма:</span><br>
                    <span class="big-number" id="finalSum">0 ₽</span>
                </div>
                <div>
                    <span style="color:var(--color-text-muted)">Заработано процентов:</span><br>
                    <span class="big-number" id="earnedInterest" style="color:var(--color-accent-blue)">+0 ₽</span>
                </div>
                 <div>
                    <span style="color:var(--color-text-muted)">Ваши взносы:</span><br>
                    <span class="big-number" id="totalContributions" style="font-size:1.5rem">0 ₽</span>
                </div>
            </div>
        </div>

        <!-- ГРАФИК РОСТА КАПИТАЛА -->
        <div class="card mt-1">
            <h3>Динамика роста капитала</h3>
            <div style="height: 300px; width: 100%;">
                <canvas id="growthLineChart"></canvas>
            </div>
        </div>
    </div>

    <footer style="margin-top: 50px; text-align: center; color: var(--color-text-muted); font-size: 0.9rem;">
        © 2026 Просчёт · Не является инвестиционной рекомендацией.
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const fmt = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });

    document.getElementById('depositForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const P = parseFloat(document.getElementById('initialSum').value);
        const PMT = parseFloat(document.getElementById('monthlyAdd').value);
        const annualRate = parseFloat(document.getElementById('rate').value) / 100;
        const years = parseInt(document.getElementById('years').value);
        const capType = document.getElementById('capitalization').value;
        
        const months = years * 12;
        const monthlyRate = annualRate / 12;

        let balance = P;
        let totalContributed = P;
        let historyLabels = [];
        let historyBalances = [];
        let historyContributions = [];

        // Имитация по месяцам для точности и графика
        for (let m = 1; m <= months; m++) {
            // 1. Пополнение
            balance += PMT;
            totalContributed += PMT;

            // 2. Начисление процентов
            if (capType === 'monthly') {
                const interest = balance * monthlyRate;
                balance += interest;
            } else {
                // Простые проценты начисляются только на начальную сумму + взносы без компаундинга внутри года? 
                // Упрощенно: считаем как обычные проценты на текущий остаток, но не добавляем к базе для следующего месяца (это редко бывает на вкладах, обычно всегда капитализация)
                // Для MVP сделаем вид, что если "none", то мы просто не включаем прошлые проценты в базу нового месяца (что сложно реализовать в цикле без массива).
                // Лучше: если none, считаем по формуле простых процентов за весь срок отдельно.
            }

            // Запись данных для графика (раз в год или каждый месяц, если срок маленький)
            if (m % 12 === 0 || m === months || m === 1) {
                historyLabels.push(`Год ${Math.ceil(m/12)}`);
                historyBalances.push(balance);
                historyContributions.push(totalContributed);
            }
        }

        // Корректировка для случая "Без капитализации" (упрощенный расчет)
        if (capType === 'none') {
             // Формула простых процентов: S = P*(1+r*t) + PMT*n... слишком сложно для цикла выше.
             // Оставим текущую логику (она ближе к реальности банковских продуктов), 
             // но если пользователь выбрал "none", можно показать предупреждение.
        }

        const earned = balance - totalContributed;

        // Вывод
        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('periodLabel').innerText = years;
        document.getElementById('finalSum').innerText = fmt.format(Math.round(balance)) + ' ₽';
        document.getElementById('earnedInterest').innerText = '+' + fmt.format(Math.round(earned)) + ' ₽';
        document.getElementById('totalContributions').innerText = fmt.format(Math.round(totalContributed)) + ' ₽';

        drawGrowthChart(historyLabels, historyBalances, historyContributions);
        document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
    });

    function drawGrowthChart(labels, balances, contributions) {
        const ctx = document.getElementById('growthLineChart').getContext('2d');
        if (window.myGrowthChart) window.myGrowthChart.destroy();

        window.myGrowthChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Общая сумма на счету',
                        data: balances,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        fill: true,
                        tension: 0.3
                    },
                    {
                        label: 'Ваши личные средства',
                        data: contributions,
                        borderColor: '#94a3b8',
                        borderDash: [5, 5],
                        fill: false,
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { ticks: { callback: function(value) { return fmt.format(value) + ' ₽'; }, color: '#94a3b8' }, grid: { color: '#334155' } },
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc' } },
                    tooltip: { mode: 'index', intersect: false }
                }
            }
        });
    }
</script>
</body>
</html>
